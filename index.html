<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Addis Football Meetup</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ── RESET & TOKENS ─────────────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{\n  --c-bg:#f9fafb;\n  --c-surface:#ffffff;\n  --c-border:#e5e7eb;\n  --c-border-focus:#10b981;\n  --c-text:#111827;\n  --c-text-2:#6b7280;\n  --c-text-3:#9ca3af;\n  --c-green:#10b981;\n  --c-green-dark:#059669;\n  --c-green-light:#ecfdf5;\n  --c-green-mid:#d1fae5;\n  --c-amber:#f59e0b;\n  --c-amber-light:#fffbeb;\n  --c-red:#ef4444;\n}
body{font-family:'Inter',sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.5;padding-bottom:80px}
.view{display:none;padding:16px;max-width:600px;margin:0 auto}
.view.active{display:block}

/* ── VERIFICATION FORM STYLES ────────────────────────────────────────── */
.verify-box{background:var(--c-surface);border:1px solid var(--c-border);border-radius:12px;padding:16px;margin-bottom:16px}
.vb-title{font-size:16px;font-weight:700;margin-bottom:4px}
.vb-sub{font-size:14px;color:var(--c-text-2);margin-bottom:16px}
.bank-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.bank-tab{padding:10px;border:1px solid var(--c-border);background:#f3f4f6;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;color:var(--c-text-2);transition:all 0.2s}
.bank-tab.active{background:var(--c-green-light);border-color:var(--c-green);color:var(--c-green-dark)}
.verify-field{margin-bottom:14px}
.verify-field label{display:block;font-size:12px;font-weight:600;color:var(--c-text-2);margin-bottom:6px}
.verify-field input{width:100%;padding:12px;border:1px solid var(--c-border);border-radius:8px;font-size:14px;outline:none;transition:border-color 0.2s}
.verify-field input:focus{border-color:var(--c-green)}
.verify-btn{width:100%;padding:14px;background:var(--c-green);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:background 0.2s}
.verify-btn:hover{background:var(--c-green-dark)}
.verify-btn:disabled{background:var(--c-text-3);cursor:not-allowed}
.verify-err{color:var(--c-red);font-size:13px;font-weight:500;margin-bottom:12px;display:none}
.verify-err.show{display:block}
.success-card{background:var(--c-green-light);border:1px solid var(--c-green-mid);border-radius:12px;padding:20px;text-align:center;margin-bottom:16px}
.sc-icon{font-size:32px;margin-bottom:8px}
.sc-title{font-weight:700;color:var(--c-green-dark);margin-size:16px}
.sc-sub{font-size:13px;color:var(--c-text-2)}

/* Basic Spinner UI */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin 1s ease-in-out infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

  <div id="view-payment" class="view active">
    <div style="background:#fff; border:1px solid var(--c-border); border-radius:12px; padding:16px; margin-bottom:16px;">
      <h3 id="tk-game">Game Session</h3>
      <p id="tk-booking-type" style="font-size:14px; color:var(--c-text-2);"></p>
      <p id="tk-amount" style="font-size:18px; font-weight:700; color:var(--c-green); margin-top:8px;">— ETB</p>
    </div>

    <div class="verify-box" id="verify-form-section">
      <div class="vb-title">Verify Your Transfer</div>
      <div class="vb-sub">Amount to transfer: <span id="vb-amount" style="font-weight:700; color:var(--c-green);">—</span> ETB</div>
      
      <div class="verify-err" id="verify-err"></div>

      <div class="bank-tabs">
        <button class="bank-tab active" id="btab-cbe" onclick="selectBank('cbe')">CBE</button>
        <button class="bank-tab" id="btab-tele" onclick="selectBank('telebirr')">Telebirr</button>
      </div>

      <input type="hidden" id="v-bank" value="cbe">

      <div class="verify-field" id="vf-ref-row">
        <label id="v-ref-label">Transaction Reference / TXID</label>
        <input type="text" id="v-ref" placeholder="e.g. FT231..." autocomplete="off">
      </div>

      <div class="verify-field" id="vf-suffix-row" style="display:none;">
        <label>Last 4 Digits of Phone Number</label>
        <input type="number" id="v-suffix" placeholder="e.g. 4321" max="9999">
      </div>

      <button class="verify-btn" id="verify-submit-btn" onclick="verifyPayment()">Submit Verification</button>
    </div>

    <div class="success-card" id="verify-success-section" style="display:none;">
      <div class="sc-icon">🎉</div>
      <div class="sc-title">Verification Submitted!</div>
      <div class="sc-sub">We are checking your reference code. Your spot status will update soon under My Spots.</div>
    </div>

    <div class="tg-box" style="background:#fff; border:1px solid var(--c-border); border-radius:12px; padding:16px;">
      <p style="font-size:13px; color:var(--c-text-2);">Alternative manual support:</p>
      <a id="tg-link" href="#" target="_blank" style="color:var(--c-green); font-weight:600; text-decoration:none;">Open Telegram Chat</a>
      <div id="tg-note" style="font-size:12px; color:var(--c-text-3);"></div>
      <div id="steps-code" style="display:none;"></div>
      <div id="pi-bank-name" style="display:none;"></div>
      <div id="pi-acc-name" style="display:none;"></div>
      <div id="pi-acc-num" style="display:none;"></div>
      <div id="pi-telebirr" style="display:none;"></div>
      <div id="pi-amount" style="display:none;"></div>
      <div id="pi-ref" style="display:none;"></div>
    </div>
  </div>

  <script>
  var API = 'https://addis-football-backend-production-bdb0.up.railway.app'; // Modify to your current active host base url
  var token = null;
  var currentGame = { id: 1, name: "Weekend Match Test", date: "2026-06-12", time: "16:00", location: "Addis Stadium" };
  var activeVerifyBank = 'cbe';
  var currentRegId = null;

  /* Global helper abstractions */
  function val(id) { return (document.getElementById(id)?.value || '').trim(); }
  function toast(msg) { console.log("Toast notification: " + msg); }
  function showView(viewName) { console.log("Navigating to view: " + viewName); }
  function navHighlight(item) { }
  function fmtDate(d) { return d; }
  function fmtTime(t) { return t; }
  async function loadGames() { }

  async function apiFetch(url, method, body, auth) {
    if (auth === undefined) auth = true;
    var opts = { method: method, headers: { 'Content-Type': 'application/json' } };
    if (auth && token) opts.headers['Authorization'] = 'Bearer ' + token;
    if (body) opts.body = JSON.stringify(body);
    
    var res = await fetch(url, opts);
    if (!res.ok) { var errorData = await res.json().catch(() => ({})); throw new Error(errorData.message || 'Server error'); }
    return res.json();
  }

  /* Core workflow function executed on checkout form submission */
  async function submitReg() {
    var count = 1; 
    var bookingType = 'single';
    
    try {
      var r   = await apiFetch(API + '/api/registrations', 'POST', { gameId: currentGame.id, playerCount: count, bookingType: bookingType });
      var reg = r.registration;
      var pi  = r.paymentInfo;
      currentRegId = reg.id; 

      // Render out interface card details
      document.getElementById('tk-game').textContent         = currentGame.name;
      document.getElementById('tk-booking-type').textContent = bookingType === 'monthly' ? '📅 Monthly – 4 Weeks' : '🎟 Single Game';
      document.getElementById('tk-amount').textContent       = reg.totalAmount + ' ETB';
      
      // Update our payment authentication form dynamic elements text lines safely
      document.getElementById('vb-amount').textContent       = reg.totalAmount;
      document.getElementById('verify-form-section').style.display    = 'block';
      document.getElementById('verify-success-section').style.display = 'none';
      document.getElementById('v-ref').value    = '';
      document.getElementById('v-suffix').value = '';
      selectBank('cbe');

      // Populate dummy mapping objects hidden fields safely
      document.getElementById('pi-bank-name').textContent = pi.bankName;
      document.getElementById('pi-acc-name').textContent  = pi.accountName;
      document.getElementById('pi-acc-num').textContent   = pi.accountNumber;
      document.getElementById('pi-telebirr').textContent  = pi.telebirr;
      document.getElementById('pi-amount').textContent    = pi.amount + ' ETB';
      document.getElementById('pi-ref').textContent       = reg.code;

      var handle = pi.telegram || '@AddisFootballAdmin';
      var tgUser = handle.replace('@', '');
      var tgMsg  = 'Hi! My ticket code is ' + reg.code + '. Sending my payment screenshot now.';
      document.getElementById('tg-link').href = 'https://t.me/' + tgUser + '?text=' + encodeURIComponent(tgMsg);
      document.getElementById('tg-note').textContent = 'Admin Username: ' + handle;
      document.getElementById('steps-code').textContent = reg.code;

      await loadGames();
      showView('payment');
      navHighlight('games');
      toast('✅ Spot reserved! ' + reg.code);
    } catch (e) {
      console.error(e);
      toast('❌ Error processing registration: ' + e.message);
    }
  }

  /* ─── PAYMENT VERIFICATION HANDLERS ─────────────────────────────────── */
  function selectBank(bank) {
    activeVerifyBank = bank;
    document.getElementById('v-bank').value = bank;
    
    var isCBE = bank === 'cbe';
    document.getElementById('btab-cbe').classList.toggle('active', isCBE);
    document.getElementById('btab-tele').classList.toggle('active', !isCBE);
    
    if (isCBE) {
      document.getElementById('v-ref-label').textContent = 'Transaction Reference / TXID';
      document.getElementById('v-ref').placeholder = 'e.g. FT231...';
      document.getElementById('vf-suffix-row').style.display = 'none';
    } else {
      document.getElementById('v-ref-label').textContent = 'Transaction Reference (Optional)';
      document.getElementById('v-ref').placeholder = 'e.g. 10478...';
      document.getElementById('vf-suffix-row').style.display = 'block';
    }
  }

  async function verifyPayment() {
    var errEl = document.getElementById('verify-err');
    var btn = document.getElementById('verify-submit-btn');
    errEl.classList.remove('show');
    
    var bank = document.getElementById('v-bank').value;
    var refCode = val('v-ref');
    var suffix = val('v-suffix');
    
    if (bank === 'cbe' && !refCode) {
      errEl.textContent = '❌ Please enter your CBE transaction reference code.';
      errEl.classList.add('show');
      return;
    }
    if (bank === 'telebirr' && !refCode && !suffix) {
      errEl.textContent = '❌ Please provide either the transaction reference or the last 4 digits of your phone.';
      errEl.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div> Submitting...';
    
    try {
      await apiFetch(API + '/api/registrations/' + currentRegId + '/verify', 'POST', {
        bank: bank,
        referenceCode: refCode,
        phoneSuffix: suffix
      });
      
      document.getElementById('verify-form-section').style.display = 'none';
      document.getElementById('verify-success-section').style.display = 'block';
      toast('✅ Payment details logged!');
      if (window.Telegram?.WebApp) Telegram.WebApp.HapticFeedback.notificationOccurred('success');
    } catch (e) {
      errEl.textContent = '❌ ' + e.message;
      errEl.classList.add('show');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Submit Verification';
    }
  }
  </script>
</body>
</html>
